<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission Possible #95400 | FIRST LEGO League Team</title>

  <!-- Google Kanit Font (300-900) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            kanit: ['Kanit', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, Framer Motion, Babel CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      font-family: 'Kanit', sans-serif;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    .hero-heading-dark {
      background: linear-gradient(180deg, #646973 0%, #BBCCD7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-heading-light {
      background: linear-gradient(180deg, #1E293B 0%, #64748B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #71717A;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #B600A8;
    }
  </style>
</head>
<body class="bg-[#0C0C0C] text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, useScroll, useTransform, AnimatePresence, useMotionValue, useSpring } = window.Motion;

    // ==========================================
    // 1. Fullscreen Intro Video Overlay (Replay & Enter)
    // ==========================================
    const IntroOverlay = ({ onEnterSite }) => {
      const [isEnded, setIsEnded] = useState(false);
      const videoRef = useRef(null);

      const handleEnded = () => {
        setIsEnded(true);
      };

      const handleReplay = (e) => {
        e.stopPropagation();
        if (videoRef.current) {
          videoRef.current.currentTime = 0;
          videoRef.current.play();
          setIsEnded(false);
        }
      };

      return (
        <motion.div
          initial={{ opacity: 1 }}
          exit={{ opacity: 0, transition: { duration: 0.9, ease: [0.25, 0.1, 0.25, 1] } }}
          className="fixed inset-0 z-[100] bg-black flex items-center justify-center overflow-hidden"
        >
          {/* Video Player */}
          <video
            ref={videoRef}
            src="./20678.mp4"
            autoPlay
            muted
            playsInline
            onEnded={handleEnded}
            className="w-full h-full object-contain pointer-events-none"
          />

          {/* Top-Right Quick Skip Button */}
          <button
            onClick={onEnterSite}
            className="absolute top-6 right-6 z-[102] px-4 py-2 rounded-full bg-white/10 hover:bg-white/25 backdrop-blur-md border border-white/20 text-white text-xs uppercase tracking-widest transition-all hover:scale-105 active:scale-95 flex items-center gap-1.5"
          >
            <span>Skip Intro</span>
            <span>→</span>
          </button>

          {/* Centered Action Controls upon Video Completion */}
          <AnimatePresence>
            {isEnded && (
              <motion.div
                initial={{ opacity: 0, scale: 0.9, y: 20 }}
                animate={{ opacity: 1, scale: 1, y: 0 }}
                exit={{ opacity: 0, scale: 0.9 }}
                transition={{ duration: 0.5, ease: "easeOut" }}
                className="absolute inset-0 z-[101] bg-black/70 backdrop-blur-sm flex flex-col items-center justify-center px-4"
              >
                <div className="text-center mb-8">
                  <div className="inline-flex items-center gap-2 px-3.5 py-1 rounded-full bg-white/10 border border-white/20 text-xs tracking-widest text-[#BBCCD7] uppercase mb-3">
                    <span className="w-1.5 h-1.5 rounded-full bg-yellow-400 animate-pulse"></span>
                    <span>FIRST LEGO League #95400</span>
                  </div>
                  <h2 className="text-2xl sm:text-4xl font-black uppercase tracking-tight text-white">
                    Mission Possible
                  </h2>
                  <p className="text-xs sm:text-sm text-[#BBCCD7]/70 mt-2 tracking-wider">
                    Intro video complete. Click below to enter our engineering showcase.
                  </p>
                </div>

                <div className="flex flex-col sm:flex-row items-center gap-4">
                  {/* Enter Site Button */}
                  <button
                    onClick={onEnterSite}
                    className="w-48 sm:w-auto px-8 py-3.5 rounded-full font-bold uppercase tracking-widest text-xs sm:text-sm text-white shadow-xl transition-all duration-200 hover:scale-105 active:scale-95"
                    style={{
                      background: "linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%)",
                      boxShadow: "0px 4px 14px rgba(182, 0, 168, 0.4), 2px 2px 10px #7721B1 inset",
                      outline: "2px solid #E3E3E3",
                      outlineOffset: "-2px"
                    }}
                  >
                    Enter Site →
                  </button>

                  {/* Replay Button */}
                  <button
                    onClick={handleReplay}
                    className="w-48 sm:w-auto px-6 py-3.5 rounded-full bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/30 text-white text-xs sm:text-sm font-semibold uppercase tracking-widest transition-all duration-200 hover:scale-105 active:scale-95 flex items-center justify-center gap-2"
                  >
                    <svg className="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" strokeWidth={2} viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span>Replay Video</span>
                  </button>
                </div>
              </motion.div>
            )}
          </AnimatePresence>

          <div className="absolute bottom-8 left-1/2 -translate-x-1/2 text-white/30 text-[11px] tracking-widest uppercase pointer-events-none select-none">
            FIRST LEGO League Challenge
          </div>
        </motion.div>
      );
    };

    // ==========================================
    // 2. Team Logo Component (Loads local logo.jpg with fallback)
    // ==========================================
    const TeamLogo = ({ className = "w-10 h-10" }) => (
      <div className={`relative flex items-center justify-center overflow-hidden rounded-xl bg-[#080b14] border border-cyan-500/30 p-0.5 shadow-md shadow-cyan-500/20 ${className}`}>
        <img 
          src="./logo.jpg" 
          alt="Mission Possible Logo" 
          className="w-full h-full object-cover rounded-lg"
          onError={(e) => {
            e.target.style.display = 'none';
          }}
        />
      </div>
    );

    // ==========================================
    // 3. 3D Tilt Card Component
    // ==========================================
    const TiltCard = ({ children, className = "" }) => {
      const cardRef = useRef(null);
      const x = useMotionValue(0);
      const y = useMotionValue(0);

      const mouseXSpring = useSpring(x, { stiffness: 220, damping: 20 });
      const mouseYSpring = useSpring(y, { stiffness: 220, damping: 20 });

      const rotateX = useTransform(mouseYSpring, [-0.5, 0.5], ["10deg", "-10deg"]);
      const rotateY = useTransform(mouseXSpring, [-0.5, 0.5], ["-10deg", "10deg"]);

      const handleMouseMove = (e) => {
        if (!cardRef.current) return;
        const rect = cardRef.current.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;
        x.set(mouseX / rect.width - 0.5);
        y.set(mouseY / rect.height - 0.5);
      };

      const handleMouseLeave = () => {
        x.set(0);
        y.set(0);
      };

      return (
        <motion.div
          ref={cardRef}
          onMouseMove={handleMouseMove}
          onMouseLeave={handleMouseLeave}
          style={{
            rotateX,
            rotateY,
            transformStyle: "preserve-3d",
          }}
          className={`relative transition-all duration-200 ${className}`}
        >
          <div style={{ transform: "translateZ(25px)" }}>
            {children}
          </div>
        </motion.div>
      );
    };

    // ==========================================
    // 4. Reusable FadeIn Component
    // ==========================================
    const FadeIn = ({
      children,
      delay = 0,
      duration = 0.7,
      x = 0,
      y = 30,
      className = "",
      style = {},
      as = "div"
    }) => {
      const Component = motion[as] || motion.div;
      return (
        <Component
          variants={{
            hidden: { opacity: 0, x, y },
            visible: {
              opacity: 1,
              x: 0,
              y: 0,
              transition: {
                duration,
                delay,
                ease: [0.25, 0.1, 0.25, 1],
              },
            },
          }}
          initial="hidden"
          whileInView="visible"
          viewport={{ once: true, margin: "50px", amount: 0 }}
          className={className}
          style={style}
        >
          {children}
        </Component>
      );
    };

    // ==========================================
    // 5. Scroll Character Reveal Component
    // ==========================================
    const ScrollChar = ({ char, index, total, scrollYProgress, isDark }) => {
      const charProgress = index / total;
      const start = Math.max(0, charProgress - 0.1);
      const end = Math.min(1, charProgress + 0.05);
      const opacity = useTransform(scrollYProgress, [start, end], [0.2, 1]);

      return (
        <span className="relative inline-block">
          <span className="opacity-0">{char === " " ? "\u00A0" : char}</span>
          <motion.span
            style={{ opacity }}
            className={`absolute inset-0 select-none ${isDark ? 'text-[#D7E2EA]' : 'text-slate-900 font-semibold'}`}
          >
            {char === " " ? "\u00A0" : char}
          </motion.span>
        </span>
      );
    };

    // ==========================================
    // 6. 7 Core Team Members (Names Only)
    // ==========================================
    const TEAM_MEMBERS = [
      { name: "Erika",  initials: "EK", color: "from-cyan-400 to-blue-600" },
      { name: "Jeremy", initials: "JM", color: "from-purple-400 to-indigo-600" },
      { name: "Hugo",   initials: "HG", color: "from-emerald-400 to-teal-600" },
      { name: "David",  initials: "DW", color: "from-amber-400 to-orange-600" },
      { name: "Esther", initials: "ET", color: "from-pink-400 to-rose-600" },
      { name: "Bella",  initials: "BL", color: "from-fuchsia-400 to-purple-600" },
      { name: "Lerry",  initials: "LR", color: "from-sky-400 to-cyan-600" },
    ];

    // ==========================================
    // 7. Main Application Component (App)
    // ==========================================
    function App() {
      const [showIntro, setShowIntro] = useState(true);
      const [isDark, setIsDark] = useState(true);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [copiedCode, setCopiedCode] = useState(false);
      const textContainerRef = useRef(null);

      useEffect(() => {
        if (showIntro) {
          document.body.style.overflow = "hidden";
        } else {
          document.body.style.overflow = "unset";
        }
      }, [showIntro]);

      useEffect(() => {
        if (isDark) {
          document.body.className = "bg-[#0C0C0C] text-white";
        } else {
          document.body.className = "bg-[#F8FAFC] text-slate-900";
        }
      }, [isDark]);

      const { scrollYProgress } = useScroll({
        target: textContainerRef,
        offset: ["start 0.8", "end 0.2"],
      });

      const manifestoText = 
        "With more than five years of experience in design, i focus on branding, web design, and user experience, i truly enjoy working with businesses that aim to stand out and present their best image. Let's build something incredible together!";

      const pybricksCode = `# Pybricks MicroPython - Gyro Straight & Line Square
from pybricks.hubs import PrimeHub
from pybricks.parameters import Port, Direction
from pybricks.robotics import DriveBase

hub = PrimeHub()
left_motor = Motor(Port.A, Direction.COUNTERCLOCKWISE)
right_motor = Motor(Port.B)
robot = DriveBase(left_motor, right_motor, wheel_diameter=56, axle_track=112)

# Enable Gyro Closed-Loop Navigation
robot.use_gyro(True)
robot.settings(straight_speed=380, straight_acceleration=800)

def autonomous_run_1():
    robot.straight(650)          # Precision sprint to deep reef
    robot.turn(45)               # Smooth gyro heading turn
    robot.straight(200)
    hub.speaker.beep(frequency=880, duration=120)

autonomous_run_1()`;

      const copyCode = () => {
        navigator.clipboard.writeText(pybricksCode);
        setCopiedCode(true);
        setTimeout(() => setCopiedCode(false), 2000);
      };

      return (
        <div className={`min-h-screen transition-colors duration-300 ${isDark ? 'bg-[#0C0C0C] text-white selection:bg-[#B600A8] selection:text-white' : 'bg-[#F8FAFC] text-slate-900 selection:bg-purple-200'}`}>
          
          {/* Fullscreen Video Splash Overlay */}
          <AnimatePresence>
            {showIntro && (
              <IntroOverlay onEnterSite={() => setShowIntro(false)} />
            )}
          </AnimatePresence>

          {/* ================= Top Navigation Bar ================= */}
          <nav className={`fixed top-0 left-0 right-0 z-50 backdrop-blur-md border-b transition-colors duration-300 ${
            isDark ? 'bg-[#0C0C0C]/85 border-white/5' : 'bg-white/85 border-slate-200 shadow-sm'
          }`}>
            <div className="max-w-7xl mx-auto px-5 sm:px-8 h-20 flex items-center justify-between">
              
              {/* Logo + Team Name */}
              <a href="#home" className="flex items-center gap-3">
                <TeamLogo className="w-10 h-10" />
                <div className="flex flex-col">
                  <span className={`font-black tracking-wider uppercase text-base leading-tight ${isDark ? 'text-white' : 'text-slate-900'}`}>
                    Mission Possible
                  </span>
                  <span className={`text-[11px] tracking-widest uppercase ${isDark ? 'text-[#BBCCD7]/60' : 'text-slate-500'}`}>Team #95400</span>
                </div>
              </a>

              {/* Desktop Nav Items */}
              <div className={`hidden lg:flex items-center gap-8 text-sm uppercase tracking-widest ${isDark ? 'text-[#BBCCD7]' : 'text-slate-600'}`}>
                <a href="#home" className={`transition ${isDark ? 'hover:text-white' : 'hover:text-black font-semibold'}`}>Home</a>
                <a href="#team" className={`transition ${isDark ? 'hover:text-white' : 'hover:text-black font-semibold'}`}>Team</a>
                <a href="#values" className={`transition ${isDark ? 'hover:text-white' : 'hover:text-black font-semibold'}`}>Core Values</a>
                <a href="#robot" className={`transition ${isDark ? 'hover:text-white' : 'hover:text-black font-semibold'}`}>Robot</a>
                <a href="#project" className={`transition ${isDark ? 'hover:text-white' : 'hover:text-black font-semibold'}`}>Project</a>
                <a href="#outreach" className={`transition ${isDark ? 'hover:text-white' : 'hover:text-black font-semibold'}`}>Outreach</a>
                <a href="#tools" className={`transition ${isDark ? 'hover:text-white' : 'hover:text-black font-semibold'}`}>Tools</a>
              </div>

              {/* Dark / Light Toggle + Action Button */}
              <div className="hidden lg:flex items-center gap-4">
                <button
                  onClick={() => setIsDark(!isDark)}
                  aria-label="Toggle Light and Dark Mode"
                  className={`flex items-center gap-2 px-3.5 py-1.5 rounded-full border text-xs font-semibold uppercase tracking-wider transition-all duration-300 ${
                    isDark 
                      ? 'border-white/20 bg-white/5 text-yellow-300 hover:bg-white/10' 
                      : 'border-slate-300 bg-slate-100 text-slate-800 hover:bg-slate-200'
                  }`}
                >
                  {isDark ? (
                    <>
                      <svg className="w-4 h-4 text-yellow-400" fill="none" stroke="currentColor" strokeWidth={2} viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5" />
                        <path strokeLinecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                      </svg>
                      <span>Light</span>
                    </>
                  ) : (
                    <>
                      <svg className="w-4 h-4 text-indigo-600" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                      </svg>
                      <span>Dark</span>
                    </>
                  )}
                </button>

                <a 
                  href="#contact" 
                  className={`px-5 py-2 rounded-full border text-xs uppercase tracking-widest transition ${
                    isDark 
                      ? 'border-white/20 hover:border-cyan-400 hover:text-cyan-400 text-white' 
                      : 'border-slate-300 bg-slate-900 text-white hover:bg-slate-800'
                  }`}
                >
                  Contact Us
                </a>
              </div>

              {/* Mobile Menu & Mode Toggle */}
              <div className="lg:hidden flex items-center gap-3">
                <button
                  onClick={() => setIsDark(!isDark)}
                  className={`p-2 rounded-full border ${isDark ? 'border-white/20 text-yellow-300' : 'border-slate-300 text-slate-800'}`}
                >
                  {isDark ? (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth={2} viewBox="0 0 24 24">
                      <circle cx="12" cy="12" r="5" />
                      <path strokeLinecap="round" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                    </svg>
                  ) : (
                    <svg className="w-5 h-5 text-indigo-600" fill="currentColor" viewBox="0 0 20 20">
                      <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
                    </svg>
                  )}
                </button>

                <button 
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                  className={`p-2 ${isDark ? 'text-white/80 hover:text-white' : 'text-slate-700 hover:text-black'}`}
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    {mobileMenuOpen ? (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                    ) : (
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                    )}
                  </svg>
                </button>
              </div>
            </div>

            {/* Mobile Drawer */}
            <AnimatePresence>
              {mobileMenuOpen && (
                <motion.div
                  initial={{ height: 0, opacity: 0 }}
                  animate={{ height: "auto", opacity: 1 }}
                  exit={{ height: 0, opacity: 0 }}
                  className={`lg:hidden border-b px-6 py-6 flex flex-col gap-4 text-sm uppercase tracking-widest ${
                    isDark ? 'bg-[#0C0C0C] border-white/10' : 'bg-white border-slate-200'
                  }`}
                >
                  {["Home", "Team", "Values", "Robot", "Project", "Outreach", "Tools", "Contact"].map((item) => (
                    <a
                      key={item}
                      href={`#${item.toLowerCase()}`}
                      onClick={() => setMobileMenuOpen(false)}
                      className={`py-2 transition ${isDark ? 'text-[#BBCCD7] hover:text-white' : 'text-slate-700 hover:text-black font-semibold'}`}
                    >
                      {item}
                    </a>
                  ))}
                </motion.div>
              )}
            </AnimatePresence>
          </nav>

          {/* =================================================================
              1. HERO SECTION - 4 Corner 3D Floating Assets + Scroll Character Reveal
             ================================================================= */}
          <section 
            id="home"
            className={`relative min-h-screen w-full flex flex-col items-center justify-center px-5 sm:px-8 md:px-10 py-28 sm:py-32 overflow-hidden transition-colors duration-300 ${
              isDark ? 'bg-[#0C0C0C]' : 'bg-[#F8FAFC]'
            }`}
          >
            {/* 1. Top-left: Moon Icon */}
            <FadeIn
              delay={0.1}
              duration={0.9}
              x={-80}
              y={0}
              className="absolute z-0 top-[6%] left-[1%] sm:left-[2%] md:left-[4%] pointer-events-none"
            >
              <motion.img
                animate={{ y: [0, -12, 0] }}
                transition={{ duration: 5, repeat: Infinity, ease: "easeInOut" }}
                src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/moon_icon.11395d36.png"
                alt="Moon Icon"
                className="w-[120px] sm:w-[160px] md:w-[210px] h-auto object-contain select-none"
              />
            </FadeIn>

            {/* 2. Bottom-left: 3D Object */}
            <FadeIn
              delay={0.25}
              duration={0.9}
              x={-80}
              y={0}
              className="absolute z-0 bottom-[8%] left-[3%] sm:left-[6%] md:left-[10%] pointer-events-none"
            >
              <motion.img
                animate={{ y: [0, 14, 0] }}
                transition={{ duration: 6, repeat: Infinity, ease: "easeInOut", delay: 0.5 }}
                src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/p59_1.4659672e.png"
                alt="3D Capsule"
                className="w-[100px] sm:w-[140px] md:w-[180px] h-auto object-contain select-none"
              />
            </FadeIn>

            {/* 3. Top-right: Lego Icon */}
            <FadeIn
              delay={0.15}
              duration={0.9}
              x={80}
              y={0}
              className="absolute z-0 top-[6%] right-[1%] sm:right-[2%] md:right-[4%] pointer-events-none"
            >
              <motion.img
                animate={{ y: [0, -14, 0] }}
                transition={{ duration: 5.5, repeat: Infinity, ease: "easeInOut", delay: 0.2 }}
                src="https://shrug-person-78902957.figma.site/_components/v2/ebb2b8f25d8e24d5f0a5ca8af4c950de81aa2fd7/lego_icon-1.703bb594.png"
                alt="Lego Icon"
                className="w-[120px] sm:w-[160px] md:w-[210px] h-auto object-contain select-none"
              />
            </FadeIn>

            {/* 4. Bottom-right: 3D Group */}
            <FadeIn
              delay={0.3}
              duration={0.9}
              x={80}
              y={0}
              className="absolute z-0 bottom-[8%] right-[3%] sm:right-[6%] md:right-[10%] pointer-events-none"
            >
              <motion.img
                animate={{ y: [0, 12, 0] }}
                transition={{ duration: 6.2, repeat: Infinity, ease: "easeInOut", delay: 0.8 }}

                      <div className={`text-sm font-bold uppercase ${isDark ? 'text-white' : 'text-slate-900'}`}>{tool.name}</div>
                      <div className={`text-[10px] uppercase tracking-widest mt-1 ${isDark ? 'text-white/50' : 'text-slate-500'}`}>{tool.category}</div>
                    </div>
                  ))}
                </div>
              </div>

            </div>
          </section>

          {/* ================= Footer ================= */}
          <footer id="contact" className={`py-16 px-5 sm:px-8 border-t transition-colors ${
            isDark ? 'border-white/10 bg-[#080808]' : 'border-slate-200 bg-slate-100'
          }`}>
            <div className="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-6">
              <div className="flex items-center gap-3">
                <TeamLogo className="w-8 h-8" />
                <div className="text-left">
                  <div className={`font-bold uppercase text-sm ${isDark ? 'text-white' : 'text-slate-900'}`}>Mission Possible #95400</div>
                  <div className={`text-[11px] ${isDark ? 'text-white/40' : 'text-slate-500'}`}>FIRST LEGO League Challenge Team</div>
                </div>
              </div>
              <div className={`text-xs tracking-wider ${isDark ? 'text-[#BBCCD7]/60' : 'text-slate-500'}`}>
                © 2026 Mission Possible #95400. All Rights Reserved.
              </div>
            </div>
          </footer>

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
